name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Typecheck (all packages)
        run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build @tagent/pi-core (test imports it via package entry)
        run: bun run --filter='@tagent/electron' build:pi-core

      - name: Run tests
        run: bun run test

  build:
    name: Build (main + preload + renderer)
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        env:
          npm_config_electron_mirror: https://github.com/electron/electron/releases/download/
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
        run: |
          bun install --frozen-lockfile --ignore-scripts
          # bun workspaces hoist electron under the app package, not repo root
          node apps/electron/node_modules/electron/install.js

      - name: Build ui tokens
        run: bun run --filter='@tagent/ui' tokens:generate

      - name: Build main + preload + renderer
        working-directory: apps/electron
        run: bun run build

  package-windows:
    name: Package Windows
    runs-on: windows-2022
    needs: build
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        env:
          npm_config_electron_mirror: https://github.com/electron/electron/releases/download/
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
        run: |
          bun install --frozen-lockfile --ignore-scripts
          node apps/electron/node_modules/electron/install.js

      - name: Rebuild native modules for Electron
        working-directory: apps/electron
        run: bun run rebuild:native

      - name: Build and package Windows
        working-directory: apps/electron
        run: bun run package:win
