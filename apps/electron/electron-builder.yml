# 默认 = 内网 / 双核包（含 @anthropic-ai/claude-agent-sdk 与 win32 原生 claude.exe）
# 本地：cd apps/electron && bun run package:win
#   （会先 rebuild:native，与 CI release.yml 对齐）
#
# 对外版（排除 kscc 核原生 SDK）：
#   bun run package:win:external
#   → TAGENT_EXTERNAL=1 构建 main + electron-builder.external.yml
# 切勿默认破坏 dev：开发态 bun run dev 不设 TAGENT_EXTERNAL，双核仍可用。

appId: com.tagent.desktop
productName: TAgent

directories:
  output: out
  buildResources: resources

files:
  - dist/**/*
  - '!dist/**/chaos-openai-proxy/**'
  - package.json

asar: true
asarUnpack:
  - node_modules/**/*.node

# 安装包 / 快捷方式图标（圆角底板 PNG；builder 会按平台转 ico/icns）
icon: logo/appicon/light.png

win:
  icon: logo/appicon/light.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: TAgent-${version}-${arch}.${ext}

# ── NSIS 安装器品牌化（素材/脚本见 resources/installer/README.md）──
# oneClick:false = 辅助向导；保留 per-user/per-machine 选择 + 可改目录。
# installerLanguages:[zh_CN] = 中文为默认（且唯一）语言；silent/update 不受影响。
# include = installer.nsh：仅 MUI 文案 + 静默守卫的欢迎页，无 nsDialogs/MessageBox。
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  # 图标（多尺寸 .ico，同时用于卸载器，保持视觉一致）
  installerIcon: installer/installerIcon.ico
  uninstallerIcon: installer/uninstallerIcon.ico
  # 辅助向导页眉右侧小标（150x57，安装选项/目录/进度页）
  installerHeader: installer/installerHeader.bmp
  # 欢迎/完成页侧图（164x314，安装器与卸载器同源）
  installerSidebar: installer/installerSidebar.bmp
  uninstallerSidebar: installer/uninstallerSidebar.bmp
  installerLanguages:
    - zh_CN
  language: "2052"
  include: installer/installer.nsh

portable:
  artifactName: TAgent-${version}-${arch}-portable.${ext}

mac:
  icon: logo/appicon/light.png
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  artifactName: TAgent-${version}-${arch}.${ext}

linux:
  icon: logo/appicon/light.png
  category: Development
  executableName: tagent
  target:
    - AppImage
    - tar.gz
  artifactName: TAgent-${version}-${arch}.${ext}

# ── 自动更新发布源 ──
# electron-builder 会生成 latest.yml / latest-mac.yml / latest-linux.yml
# 并上传到 GitHub Release。electron-updater 客户端轮询这些文件判断是否有新版本。
# CI release.yml 会在 publish job 中合并 arm64+x64 的 latest-mac.yml。
publish:
  provider: github
  owner: Frank-LiangMX
  repo: TAgent-Desktop
