appId: com.tagent.desktop
productName: TAgent

directories:
  output: out
  buildResources: resources

files:
  - dist/**/*
  - package.json

asar: true
asarUnpack:
  - node_modules/**/*.node

# 安装包 / 快捷方式图标（圆角底板 PNG；builder 会按平台转 ico/icns）
icon: logo/appicon/light.png

win:
  icon: logo/appicon/light.png
  target:
    - target: nsis
      arch:
        - x64
  artifactName: TAgent-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true

mac:
  icon: logo/appicon/light.png
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
  artifactName: TAgent-${version}-${arch}.${ext}

linux:
  icon: logo/appicon/light.png
  category: Development
  target:
    - AppImage
    - deb
    - tar.gz
  artifactName: TAgent-${version}-${arch}.${ext}
